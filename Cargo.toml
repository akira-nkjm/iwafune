[workspace]
resolver = "3"
members = ["crates/lib/*", "crates/app/*", "crates/xtask"]

[workspace.package]
version = "0.5.7"
edition = "2024"
rust-version = "1.100"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/akira-nkjm/iwafune"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# モジュールは `x.rs` と `x/y.rs` で書き、`mod.rs` を使わない（CONTRIBUTING.md）
mod_module_files = "deny"

# 外部依存の版はここだけで決める。各 crate は `dep = { workspace = true }` で参照する。
[workspace.dependencies]
# 内部 crate
sat-units = { path = "crates/lib/units" }
sat-astro = { path = "crates/lib/astro" }
sat-analysis = { path = "crates/lib/analysis" }
fune-model = { path = "crates/app/model" }
fune-store = { path = "crates/app/store" }
fune-ops = { path = "crates/app/ops" }
fune-projection = { path = "crates/app/projection" }
fune-service = { path = "crates/app/service" }
fune-server = { path = "crates/app/server" }
# 外部
anyhow = "1.0.104"
axum = "0.8.9"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
comfy-table = "8.0.1"
libm = "0.2.16"
mime_guess = "2.0.5"
miette = { version = "7.6.0", features = ["fancy"] }
open = "5.4.5"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
similar = "3.2.1"
smol_str = { version = "0.3.7", features = ["serde"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs"] }
toml = "1.2.0"
toml_edit = "0.25.18"
tower = "0.5"
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-compat", "no-serde-warnings"] }
typenum = "1.20.1"
insta = "1.49.0"
assert_cmd = "2.2.2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
