[package]
name = "fune-cli"
description = "The `fune` command-line interface: argument parsing and output only (tables, colors, diagnostics)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

# cargo-binstall: install the release binary (GUI embedded) instead of building, e.g.
# `cargo binstall --git https://github.com/akira-nkjm/iwafune fune-cli`. Asset names follow the release workflows.
[package.metadata.binstall]
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/fune-{ version }-x86_64-linux-gnu.tar.gz"
bin-dir = "fune-{ version }-x86_64-linux-gnu/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/fune-{ version }-universal-apple-darwin.tar.gz"
bin-dir = "fune-{ version }-universal-apple-darwin/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/fune-{ version }-universal-apple-darwin.tar.gz"
bin-dir = "fune-{ version }-universal-apple-darwin/{ bin }{ binary-ext }"

[lints]
workspace = true

[dependencies]
fune-service = { workspace = true }
fune-server = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
comfy-table = { workspace = true }
owo-colors = { workspace = true }
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
open = { workspace = true }

[[bin]]
name = "fune"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
axum = { workspace = true }
tower = { workspace = true, features = ["util"] }
