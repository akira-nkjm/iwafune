section      = "aocs"

[max_torque]
label        = "最大トルク"
label_en     = "Max torque"
type         = "scalar"
dimension    = "Torque"
units        = ["N*m", "mN*m"]
display_unit = "mN*m"
min          = 0.0
section      = "aocs"

[spin_axis]
label       = "回転軸"
label_en    = "Spin axis"
description = "部品座標の単位ベクトル"
type        = "vec3"
dimension   = "Dimensionless"
unit_vector = true
section     = "aocs"

[axis]
label       = "軸"
label_en    = "Axis"
