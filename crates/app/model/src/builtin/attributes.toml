# 組み込みの属性定義（docs/architecture/registry.md §3 の実体）。
# 解析・projection・デモデータ・GUI が共有する契約。形は defs/attribute/<id>.toml と同じ（キーが ID）。
# min / max / default は SI の値。

[mass]
label        = "質量"
label_en     = "Mass"
type         = "scalar"
dimension    = "Mass"
units        = ["kg", "g"]
display_unit = "kg"
min          = 0.0
budget       = "mass"
section      = "mass"

[size]
label        = "外形（箱）"
label_en     = "Envelope (box)"
type         = "vec3"
dimension    = "Length"
units        = ["mm", "m", "cm"]
display_unit = "mm"
section      = "structure"

[power]
label        = "消費電力"
label_en     = "Power consumption"
type         = "scalar"
by_state     = true
dimension    = "Power"
units        = ["W", "mW"]
display_unit = "W"
min          = 0.0
budget       = "power"
section      = "power"

[heat_fraction]
label       = "発熱の割合"
label_en    = "Heat fraction"
description = "消費電力のうち発熱になる割合。書けば RF 出力より優先する（書かなければ発熱 = 消費電力 − RF 出力）"
type        = "scalar"
dimension   = "Dimensionless"
units       = [""]
min         = 0.0
max         = 1.0
section     = "thermal"

[rf_output]
label        = "RF 出力（発熱にならない電力）"
label_en     = "RF output (not dissipated as heat)"
description  = "状態ごとにアンテナから出ていく電力。熱解析の発熱は消費電力からこれを引く（回線計算の送信電力は tx_power）"
type         = "scalar"
by_state     = true
dimension    = "Power"
units        = ["W", "mW"]
display_unit = "W"
min          = 0.0
section      = "thermal"

[temp_op]
label        = "動作温度範囲"
label_en     = "Operating temperature range"
description  = "機能を維持する温度範囲"
type         = "range"
dimension    = "Temperature"
units        = ["degC", "K"]
display_unit = "degC"
section      = "thermal"

[temp_perf]
label        = "性能温度範囲"
label_en     = "Performance temperature range"
description  = "仕様の性能を満たす温度範囲（ふつう動作温度範囲の内側）"
type         = "range"
dimension    = "Temperature"
units        = ["degC", "K"]
display_unit = "degC"
section      = "thermal"

[temp_survival]
label        = "保管温度範囲（非動作）"
label_en     = "Storage (non-operating) temperature range"
description  = "電源を切っていても壊れない温度範囲"
type         = "range"
dimension    = "Temperature"
units        = ["degC", "K"]
display_unit = "degC"
section      = "thermal"

[specific_heat]
label        = "比熱"
label_en     = "Specific heat"
type         = "scalar"
dimension    = "SpecificHeatCapacity"
units        = ["J/(kg*K)"]
display_unit = "J/(kg*K)"
min          = 0.0
default      = 900.0  # アルミ合金の代表値（書かれていなければ仮置きとして使う）
section      = "thermal"

[absorptivity]
label     = "太陽光吸収率"
label_en  = "Solar absorptivity"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "thermal"

[emissivity]
label     = "赤外放射率"
label_en  = "IR emissivity"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "thermal"

[hk_rate]
label        = "HK データレート"
label_en     = "HK data rate"
type         = "scalar"
by_state     = true
dimension    = "DataRate"
units        = ["bit/s", "kbit/s"]
display_unit = "bit/s"
min          = 0.0
budget       = "data"
section      = "cdh"

[mission_rate]
label        = "ミッションデータレート"
label_en     = "Mission data rate"
type         = "scalar"
by_state     = true
dimension    = "DataRate"
units        = ["bit/s", "kbit/s", "Mbit/s"]
display_unit = "Mbit/s"
min          = 0.0
budget       = "data"
section      = "cdh"

[capacity]
label        = "電池容量"
label_en     = "Battery capacity"
type         = "scalar"
dimension    = "Energy"
units        = ["Wh", "J"]
display_unit = "Wh"
min          = 0.0
section      = "power"

[voltage]
label        = "公称電圧"
label_en     = "Nominal voltage"
type         = "scalar"
dimension    = "Voltage"
units        = ["V"]
display_unit = "V"
section      = "power"

[charge_efficiency]
label     = "充電効率"
label_en  = "Charge efficiency"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "power"

[discharge_efficiency]
label     = "放電効率"
label_en  = "Discharge efficiency"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "power"

[area]
label        = "面積"
label_en     = "Area"
type         = "scalar"
dimension    = "Area"
units        = ["m^2", "cm^2", "mm^2"]
display_unit = "cm^2"
min          = 0.0
section      = "power"

[cell_efficiency]
label     = "セル変換効率"
label_en  = "Cell efficiency"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "power"

[packing_factor]
label     = "セル充填率"
label_en  = "Packing factor"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "power"

[eol_factor]
label       = "EOL 劣化係数"
label_en    = "EOL degradation factor"
description = "寿命末期の出力 / 初期の出力"
type        = "scalar"
dimension   = "Dimensionless"
units       = [""]
min         = 0.0
max         = 1.0
section     = "power"

[cell_voltage]
label        = "セル電圧"
label_en     = "Cell voltage"
description  = "直並列サイジングに使う寿命初期の動作電圧"
type         = "scalar"
dimension    = "Voltage"
units        = ["V"]
display_unit = "V"
min          = 0.0
section      = "power"

[cell_current]
label        = "セル電流"
label_en     = "Cell current"
description  = "直並列サイジングに使う寿命初期の動作電流"
type         = "scalar"
dimension    = "ElectricCurrent"
units        = ["A", "mA"]
display_unit = "A"
min          = 0.0
section      = "power"

[normal]
label       = "面の法線"
label_en    = "Surface normal"
description = "部品座標の単位ベクトル"
type        = "vec3"
dimension   = "Dimensionless"
unit_vector = true
section     = "power"

[max_momentum]
label        = "最大角運動量"
label_en     = "Max momentum"
type         = "scalar"
dimension    = "AngularMomentum"
units        = ["N*m*s", "mN*m*s"]
display_unit = "mN*m*s"
min          = 0.0
section      = "aocs"

[max_torque]
label        = "最大トルク"
label_en     = "Max torque"
type         = "scalar"
dimension    = "Torque"
units        = ["N*m", "mN*m"]
display_unit = "mN*m"
min          = 0.0
section      = "aocs"

[spin_axis]
label       = "回転軸"
label_en    = "Spin axis"
description = "部品座標の単位ベクトル"
type        = "vec3"
dimension   = "Dimensionless"
unit_vector = true
section     = "aocs"

[axis]
label       = "軸"
label_en    = "Axis"
description = "部品座標の単位ベクトル"
type        = "vec3"
dimension   = "Dimensionless"
unit_vector = true
section     = "aocs"

[max_dipole]
label        = "最大磁気双極子"
label_en     = "Max dipole"
type         = "scalar"
dimension    = "MagneticDipoleMoment"
units        = ["A*m^2"]
display_unit = "A*m^2"
min          = 0.0
section      = "aocs"

[thrust]
label        = "推力"
label_en     = "Thrust"
type         = "scalar"
dimension    = "Force"
units        = ["N", "mN"]
display_unit = "mN"
min          = 0.0
section      = "aocs"

[isp]
label        = "比推力"
label_en     = "Specific impulse"
type         = "scalar"
dimension    = "Time"
units        = ["s"]
display_unit = "s"
min          = 0.0
section      = "aocs"

[direction]
label       = "推力の向き"
label_en    = "Thrust direction"
description = "部品座標の単位ベクトル"
type        = "vec3"
dimension   = "Dimensionless"
unit_vector = true
section     = "aocs"

[plume_half_angle]
label        = "噴流の半角"
label_en     = "Plume half angle"
description  = "排気が広がる円錐の半頂角（推力の向きの反対が軸）。機体の部品が噴流に入っていないかの確認に使う"
type         = "scalar"
dimension    = "Angle"
units        = ["deg", "rad"]
display_unit = "deg"
min          = 0.0
max          = 1.5707963267948966
section      = "propulsion"

[boresight]
label       = "視線方向"
label_en    = "Boresight"
description = "部品座標の単位ベクトル"
type        = "vec3"
dimension   = "Dimensionless"
unit_vector = true
section     = "aocs"

[fov_half_angle]
label        = "視野の半角"
label_en     = "FOV half angle"
fov_axis     = "boresight"
type         = "scalar"
dimension    = "Angle"
units        = ["deg", "rad"]
display_unit = "deg"
min          = 0.0
section      = "aocs"

[exclusion_sun]
label        = "太陽の禁止角"
label_en     = "Sun exclusion angle"
type         = "scalar"
dimension    = "Angle"
units        = ["deg", "rad"]
display_unit = "deg"
min          = 0.0
section      = "aocs"

[exclusion_earth]
label        = "地球の禁止角"
label_en     = "Earth exclusion angle"
type         = "scalar"
dimension    = "Angle"
units        = ["deg", "rad"]
display_unit = "deg"
min          = 0.0
section      = "aocs"

[exclusion_moon]
label        = "月の禁止角"
label_en     = "Moon exclusion angle"
type         = "scalar"
dimension    = "Angle"
units        = ["deg", "rad"]
display_unit = "deg"
min          = 0.0
section      = "aocs"

[tx_power]
label        = "送信電力（RF）"
label_en     = "TX power (RF)"
type         = "scalar"
dimension    = "Power"
units        = ["W", "mW", "dBm", "dBW"]
display_unit = "W"
section      = "comm"

[frequency_down]
label        = "ダウンリンク周波数"
label_en     = "Downlink frequency"
type         = "scalar"
dimension    = "Frequency"
units        = ["MHz", "GHz", "kHz", "Hz"]
display_unit = "MHz"
min          = 0.0
section      = "comm"

[frequency_up]
label        = "アップリンク周波数"
label_en     = "Uplink frequency"
type         = "scalar"
dimension    = "Frequency"
units        = ["MHz", "GHz", "kHz", "Hz"]
display_unit = "MHz"
min          = 0.0
section      = "comm"

[data_rate_down]
label        = "ダウンリンクのビットレート"
label_en     = "Downlink data rate"
type         = "scalar"
dimension    = "DataRate"
units        = ["kbit/s", "bit/s", "Mbit/s"]
display_unit = "kbit/s"
min          = 0.0
section      = "comm"

[data_rate_up]
label        = "アップリンクのビットレート"
label_en     = "Uplink data rate"
type         = "scalar"
dimension    = "DataRate"
units        = ["kbit/s", "bit/s", "Mbit/s"]
display_unit = "kbit/s"
min          = 0.0
section      = "comm"

[antenna_gain]
label        = "アンテナ利得"
label_en     = "Antenna gain"
type         = "scalar"
dimension    = "Dimensionless"
units        = ["dBi", "dB"]
display_unit = "dBi"
section      = "comm"

[noise_temperature]
label        = "雑音温度"
label_en     = "Noise temperature"
type         = "scalar"
dimension    = "Temperature"
units        = ["K"]
display_unit = "K"
min          = 0.0
section      = "comm"

[storage_capacity]
label        = "ストレージ容量"
label_en     = "Storage capacity"
type         = "scalar"
dimension    = "Information"
units        = ["GB", "Gbit", "MB", "Mbit"]
display_unit = "GB"
min          = 0.0
section      = "cdh"

[setpoint]
label        = "制御温度（オン・オフ）"
label_en     = "Heater set point (on/off)"
type         = "range"
dimension    = "Temperature"
units        = ["degC", "K"]
display_unit = "degC"
section      = "thermal"

[thickness]
label        = "板厚"
label_en     = "Thickness"
type         = "scalar"
dimension    = "Length"
units        = ["mm", "m"]
display_unit = "mm"
min          = 0.0
section      = "structure"

[material]
label       = "材料"
label_en    = "Material"
description = "analysis/structure.toml の [material.<名前>] の名前"
type        = "enum"
section     = "structure"

[propellant]
label       = "推薬"
label_en    = "Propellant"
description = "推薬の名前（スラスタとタンクで同じ名前を書く）"
type        = "enum"
section     = "propulsion"

[propellant_density]
label        = "推薬の密度"
label_en     = "Propellant density"
type         = "scalar"
dimension    = "MassDensity"
units        = ["kg/m^3", "g/cm^3"]
display_unit = "kg/m^3"
min          = 0.0
section      = "propulsion"

[tank_volume]
label        = "タンク容積"
label_en     = "Tank volume"
description  = "推薬を入れられる容積"
type         = "scalar"
dimension    = "Volume"
units        = ["L", "mL", "m^3"]
display_unit = "L"
min          = 0.0
section      = "propulsion"

[min_impulse_bit]
label        = "最小インパルスビット"
label_en     = "Minimum impulse bit"
type         = "scalar"
dimension    = "Impulse"
units        = ["mN*s", "uN*s", "N*s"]
display_unit = "mN*s"
min          = 0.0
section      = "propulsion"

[rated_total_impulse]
label        = "定格の総インパルス"
label_en     = "Rated total impulse"
type         = "scalar"
dimension    = "Impulse"
units        = ["N*s", "kN*s"]
display_unit = "N*s"
min          = 0.0
section      = "propulsion"

[rated_firing_time]
label        = "定格の累積噴射時間"
label_en     = "Rated cumulative firing time"
type         = "scalar"
dimension    = "Time"
units        = ["h", "s"]
display_unit = "h"
min          = 0.0
section      = "propulsion"

[rated_firings]
label        = "定格の噴射回数"
label_en     = "Rated firing count"
type         = "scalar"
dimension    = "Dimensionless"
units        = [""]
min          = 0.0
section      = "propulsion"

# 打ち上げ機・ディスペンサー（種別 launcher・dispenser）の属性。衛星の部品ではなく、`conditions/launch.toml` が選ぶ条件の置き場所。
[max_payload_mass]
label        = "搭載質量の上限"
label_en     = "Maximum payload mass"
type         = "scalar"
dimension    = "Mass"
units        = ["kg", "g"]
display_unit = "kg"
min          = 0.0
section      = "structure"

[payload_mass_by_c3]
label        = "搭載質量の上限（C3 の関数）"
label_en     = "Payload mass capability versus C3"
description  = "出発の特性エネルギー C3 ごとに打ち上げ機が送れる質量。点の間は直線で結び、最後の点より大きい C3 は送れない（外挿しない）。最初の点より小さい C3 は最初の点の質量で見る"
type         = "curve"
dimension    = "Mass"
at_dimension = "SpecificEnergy"
units        = ["kg", "g"]
display_unit = "kg"
min          = 0.0
section      = "structure"

[launch_envelope]
label        = "収納外形の許容（箱）"
label_en     = "Allowed stowed envelope (box)"
description  = "機体座標の x, y, z 方向の許容の長さ。z が発射軸。軸ごとに比べ、辺の入れ替えはしない"
type         = "vec3"
dimension    = "Length"
units        = ["mm", "m", "cm"]
display_unit = "mm"
section      = "structure"

[launch_load_axial]
label        = "準静的荷重（機軸方向）"
label_en     = "Quasi-static load (axial)"
type         = "scalar"
dimension    = "Acceleration"
units        = ["g0", "m/s^2"]
display_unit = "g0"
min          = 0.0
section      = "structure"

[launch_load_lateral]
label        = "準静的荷重（直交方向）"
label_en     = "Quasi-static load (lateral)"
type         = "scalar"
dimension    = "Acceleration"
units        = ["g0", "m/s^2"]
display_unit = "g0"
min          = 0.0
section      = "structure"

[min_frequency_axial]
label        = "最低固有振動数（機軸方向）"
label_en     = "Minimum natural frequency (axial)"
type         = "scalar"
dimension    = "Frequency"
units        = ["Hz"]
display_unit = "Hz"
min          = 0.0
section      = "structure"

[min_frequency_lateral]
label        = "最低固有振動数（直交方向）"
label_en     = "Minimum natural frequency (lateral)"
type         = "scalar"
dimension    = "Frequency"
units        = ["Hz"]
display_unit = "Hz"
min          = 0.0
section      = "structure"

[max_tip_off_rate]
label        = "分離時の角速度の上限（チップオフ）"
label_en     = "Maximum tip-off angular rate at separation"
type         = "scalar"
dimension    = "AngularVelocity"
units        = ["deg/s", "rad/s"]
display_unit = "deg/s"
min          = 0.0
section      = "structure"
