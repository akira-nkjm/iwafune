# 組み込みの属性定義（docs/architecture/registry.md §3 の実体）。
# 解析・projection・デモデータ・GUI が共有する契約。形は defs/attribute/<id>.toml と同じ（キーが ID）。
# min / max / default は SI の値。

[mass]
label        = "質量"
label_en     = "Mass"
type         = "scalar"
dimension    = "Mass"
units        = ["kg", "g"]
display_unit = "kg"
min          = 0.0
budget       = "mass"
section      = "mass"

[size]
label        = "外形（箱）"
label_en     = "Envelope (box)"
type         = "vec3"
dimension    = "Length"
units        = ["mm", "m", "cm"]
display_unit = "mm"
section      = "structure"

[power]
label        = "消費電力"
label_en     = "Power consumption"
type         = "scalar"
by_state     = true
dimension    = "Power"
units        = ["W", "mW"]
display_unit = "W"
min          = 0.0
budget       = "power"
section      = "power"

[heat_fraction]
label       = "発熱の割合"
label_en    = "Heat fraction"
description = "消費電力のうち発熱になる割合"
type        = "scalar"
dimension   = "Dimensionless"
units       = [""]
min         = 0.0
max         = 1.0
default     = 1.0
section     = "thermal"

[temp_op]
label        = "動作温度範囲"
label_en     = "Operating temperature range"
type         = "range"
dimension    = "Temperature"
units        = ["degC", "K"]
display_unit = "degC"
section      = "thermal"

[temp_survival]
label        = "非動作温度範囲"
label_en     = "Survival temperature range"
type         = "range"
dimension    = "Temperature"
units        = ["degC", "K"]
display_unit = "degC"
section      = "thermal"

[specific_heat]
label        = "比熱"
label_en     = "Specific heat"
type         = "scalar"
dimension    = "SpecificHeatCapacity"
units        = ["J/(kg*K)"]
display_unit = "J/(kg*K)"
min          = 0.0
default      = 900.0  # アルミ合金の代表値（書かれていなければ仮置きとして使う）
section      = "thermal"

[absorptivity]
label     = "太陽光吸収率"
label_en  = "Solar absorptivity"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "thermal"

[emissivity]
label     = "赤外放射率"
label_en  = "IR emissivity"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "thermal"

[hk_rate]
label        = "HK データレート"
label_en     = "HK data rate"
type         = "scalar"
by_state     = true
dimension    = "DataRate"
units        = ["bit/s", "kbit/s"]
display_unit = "bit/s"
min          = 0.0
budget       = "data"
section      = "cdh"

[mission_rate]
label        = "ミッションデータレート"
label_en     = "Mission data rate"
type         = "scalar"
by_state     = true
dimension    = "DataRate"
units        = ["bit/s", "kbit/s", "Mbit/s"]
display_unit = "Mbit/s"
min          = 0.0
budget       = "data"
section      = "cdh"

[capacity]
label        = "電池容量"
label_en     = "Battery capacity"
type         = "scalar"
dimension    = "Energy"
units        = ["Wh", "J"]
display_unit = "Wh"
min          = 0.0
section      = "power"

[voltage]
label        = "公称電圧"
label_en     = "Nominal voltage"
type         = "scalar"
dimension    = "Voltage"
units        = ["V"]
display_unit = "V"
section      = "power"

[charge_efficiency]
label     = "充電効率"
label_en  = "Charge efficiency"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "power"

[discharge_efficiency]
label     = "放電効率"
label_en  = "Discharge efficiency"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "power"

[area]
label        = "面積"
label_en     = "Area"
type         = "scalar"
dimension    = "Area"
units        = ["m^2", "cm^2", "mm^2"]
display_unit = "cm^2"
min          = 0.0
section      = "power"

[cell_efficiency]
label     = "セル変換効率"
label_en  = "Cell efficiency"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "power"

[packing_factor]
label     = "セル充填率"
label_en  = "Packing factor"
type      = "scalar"
dimension = "Dimensionless"
units     = [""]
min       = 0.0
max       = 1.0
section   = "power"

[eol_factor]
label       = "EOL 劣化係数"
label_en    = "EOL degradation factor"
description = "寿命末期の出力 / 初期の出力"
type        = "scalar"
dimension   = "Dimensionless"
units       = [""]
min         = 0.0
max         = 1.0
section     = "power"

[normal]
label       = "面の法線"
label_en    = "Surface normal"
description = "部品座標の単位ベクトル"
type        = "vec3"
dimension   = "Dimensionless"
unit_vector = true
