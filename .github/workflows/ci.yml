name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

# Jobs get read-only access to the repository unless they ask for more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded runs on pull requests only; every push to main runs to completion so the badge stays accurate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# Every job runs on GitHub's runners.
jobs:
  # Which parts changed. Pull requests skip the jobs their change cannot affect; pushes to main and develop run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "site=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$files"
          hit() { printf '%s\n' "$files" | grep -Eq "$1" && echo true || echo false; }
          # Rust: the crates, the workspace files, the demo data the tests read, and the generated TS types they must match.
          echo "rust=$(hit '^(crates/|Cargo\.(toml|lock)$|rust-toolchain|\.cargo/|fixtures/|web/src/api/gen/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          echo "web=$(hit '^(web/|\.github/workflows/)')" >> "$GITHUB_OUTPUT"
          # Documentation site: the site itself, the docs it renders, and the GUI files it reads (favicon, colour tokens).
          echo "site=$(hit '^(site/|docs/|web/public/favicon\.svg|web/src/styles/index\.css|Cargo\.toml$|\.github/workflows/)')" >> "$GITHUB_OUTPUT"

  # Architecture checks (dependency direction, registry, languages, web rules). Always runs: it reads code, docs and web.
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests read the develop cache but do not save their own (keeps the develop cache from being evicted).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - run: cargo xtask check

  rust:
    needs: [changes]
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests read the develop cache but do not save their own (keeps the develop cache from being evicted).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test (including the CLI/HTTP parity tests)
        run: cargo test --workspace
      - name: generated TS types match the Rust code
        run: |
          cargo test --workspace export_ts
          git diff --exit-code -- web/src/api/gen

  web:
    needs: [changes]
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint (Biome)
        run: pnpm lint
      - name: typecheck
        run: pnpm typecheck
      - name: test
        run: pnpm test
      - name: build
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  # Documentation site (Astro, Starlight): renders docs/. Type-check, lint, unit tests and a build with the link and
  # external-request checks. Deployment is pages.yml (on main only).
  site:
    needs: [changes]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: lint (Biome)
        run: pnpm lint
      - name: typecheck (astro check)
        run: pnpm check
      - name: unit tests
        run: pnpm test
      - name: build
        run: pnpm build
      - name: check the built site (links under the base path, no external requests)
        run: pnpm check:dist

  # Build the fune binary with the embedded SPA, start it on the demo data and check that the API responds.
  # Only on pushes to main and develop: the release build is the slowest step, and every merge still runs it.
  bundle:
    # Runs alongside the rust job (it only needs the web build), so a push does not wait for the tests before the release build starts.
    needs: [web]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests read the develop cache but do not save their own (keeps the develop cache from being evicted).
          save-if: ${{ github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' }}
      - run: cargo build --release -p fune-cli
      - name: smoke (CLI)
        run: |
          ./target/release/fune -C fixtures/demo-6u check
          ./target/release/fune -C fixtures/demo-6u part ls
          ./target/release/fune -C fixtures/demo-6u analyze power.mode_load --json > /dev/null
      # Not the default port (3000): on a shared machine a running server would answer instead of this build.
      - name: smoke (HTTP)
        run: |
          ./target/release/fune -C fixtures/demo-6u gui --no-open --port 18787 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18787/api/v1/project && break; sleep 1; done
          curl -sf http://127.0.0.1:18787/api/v1/design > /dev/null
          curl -sf http://127.0.0.1:18787/ | grep -qi '<html'
      - uses: actions/upload-artifact@v7
        with:
          name: fune-linux-x64
          path: target/release/fune
