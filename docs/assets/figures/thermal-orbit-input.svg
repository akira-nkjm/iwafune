    <path d="M28 220 L364 220" fill="none" stroke="#8a6400" stroke-width="2.4" marker-end="url(#a-gold)"/>
    <text x="28" y="34.8" font-size="14" fill="#8a6400">direct sunlight S</text>
    <path d="M371.2 199.4 L366.4 164.7" fill="none" stroke="#3382c2" stroke-width="2.4" marker-end="url(#a-acc)"/>
    <path d="M455.3 137.8 L428.9 114.9" fill="none" stroke="#0097a7" stroke-width="2.4" marker-end="url(#a-teal)"/>
