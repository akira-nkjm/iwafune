    <text x="590" y="225" font-size="14" fill="#5b6577" text-anchor="middle">shadow</text>
    <text x="585" y="59.1" font-size="14" fill="#5b6577">orbit</text>
    <path d="M450 220 L436 195.8 A28 28 0 0 0 422 220 Z" fill="#fbf3d9"/>
    <path d="M436 195.8 A28 28 0 0 0 422 220" fill="none" stroke="#062654" stroke-width="1.2"/>
    <path d="M450 220 L357.5 59.8" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M450 220 L423.5 174.1" fill="none" stroke="#062654" stroke-width="1.8" marker-end="url(#a-ink)"/>
    <path d="M450 220 L397 220" fill="none" stroke="#8a6400" stroke-width="1.8" marker-end="url(#a-gold)"/>
    <circle cx="450" cy="220" r="3" fill="#062654"/>
