    <text x="394" y="211" font-size="14" fill="#8a6400" text-anchor="middle"><tspan font-weight="700">ŝ</tspan></text>
    <text x="416" y="242" font-size="12" fill="#5b6577" text-anchor="middle">solar zenith</text>
    <text x="416" y="257" font-size="12" fill="#5b6577" text-anchor="middle">angle</text>
