<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" role="img" aria-labelledby="t d">
  <title id="t">Environmental heat on an outer face</title>
  <desc id="d">Parallel sunlight arrives from the left. A planet with its shadow behind it, a circular orbit around the planet centre, and a spacecraft on the day side. At the spacecraft the face normal n and the angle theta between the normal and the nadir. At the planet centre the radial direction r towards the spacecraft, the Sun direction s and the solar zenith angle of the sub-satellite point between them. Direct sunlight reaches the face, the day side reflects sunlight as albedo, and the planet emits infrared.</desc>
  <defs>
    <marker id="a-acc" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#3382c2"/></marker>
    <marker id="a-gold" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#8a6400"/></marker>
    <marker id="a-ink" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#062654"/></marker>
    <marker id="a-teal" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#0097a7"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="371" rx="10" fill="#ffffff" stroke="#062654" stroke-opacity="0.14"/>
  <g font-family="'Noto Sans JP', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#062654" stroke-linecap="round" stroke-linejoin="round">
    <rect x="450" y="140" width="254" height="160" fill="#062654" fill-opacity="0.07"/>
    <path d="M450 140 L704 140" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M450 300 L704 300" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M284.2 331.8 A200 200 0 1 1 615.8 331.8" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="450" cy="220" r="80" fill="#e8f1f9" stroke="#062654" stroke-width="1.8"/>
    <path d="M450 140 A80 80 0 0 1 450 300 Z" fill="#062654" fill-opacity="0.1"/>
    <circle cx="450" cy="220" r="80" fill="none" stroke="#062654" stroke-width="1.8"/>
