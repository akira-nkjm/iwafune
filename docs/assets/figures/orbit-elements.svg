<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d">
  <title id="t">Orbital elements of an inclined ellipse</title>
  <desc id="d">An elliptical orbit around a body at its focus, drawn in perspective above a reference plane. The line of nodes is where the two planes meet. Omega is measured in the reference plane from the reference direction x to the ascending node, omega in the orbit plane from the ascending node to periapsis, nu from periapsis to the spacecraft, and the inclination i between the two planes at the node.</desc>
