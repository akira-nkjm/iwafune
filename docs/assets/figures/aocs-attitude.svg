    <path d="M318 159 L318 117" fill="none" stroke="#0097a7" stroke-width="2.4" marker-end="url(#a-teal)"/>
    <circle cx="318" cy="170" r="5.5" fill="#ffffff" stroke="#062654" stroke-width="1.2"/>
    <circle cx="318" cy="170" r="1.8" fill="#062654"/>
    <path d="M420 96 L459 96" fill="none" stroke="#3382c2" stroke-width="2.4" marker-end="url(#a-acc)"/>
    <text x="478" y="101" font-size="14" fill="#062654">primary axis: to the body centre</text>
    <path d="M420 140 L459 140" fill="none" stroke="#0097a7" stroke-width="2.4" marker-end="url(#a-teal)"/>
    <text x="478" y="145" font-size="14" fill="#062654">secondary axis: along the velocity</text>
