<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Two-burn transfer between circular orbits</title>
  <desc id="d">Two circular orbits around the same centre and a transfer half-ellipse with its focus at that centre. The ellipse is tangent to the inner orbit at its periapsis and to the outer orbit at its apoapsis, on opposite sides of the centre. The burns are tangential at the two tangent points.</desc>
