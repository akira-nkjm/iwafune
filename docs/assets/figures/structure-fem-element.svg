<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Four-node shell element</title>
  <desc id="d">A rectangular element with the nodes 1 to 4 at its corners and the local axes u and v in its plane, with n out of the page. Crosses mark the 2 by 2 Gauss points. Squares at the edge midpoints mark the MITC4 tying points: gamma_xi on the edges eta = plus or minus 1, gamma_eta on the edges xi = plus or minus 1. Each node has the six degrees of freedom u, v, w, theta_u, theta_v and theta_n.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#062654"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="319" rx="10" fill="#ffffff" stroke="#062654" stroke-opacity="0.14"/>
  <g font-family="'Noto Sans JP', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#062654" stroke-linecap="round" stroke-linejoin="round">
