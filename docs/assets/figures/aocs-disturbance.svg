<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">Disturbance force at the projected centre of pressure</title>
  <desc id="d">A spacecraft seen from the side with the flow or sunlight arriving from the left, against the direction u. The body is projected along u onto a plane perpendicular to u; the centroid of that silhouette gives the centre of pressure. The arm l runs from the centre of mass, perpendicular to u, to the line of the force F through the centre of pressure. F points against u and the torque is l cross F.</desc>
  <defs>
    <marker id="a-acc" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#3382c2"/></marker>
    <marker id="a-gold" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#8a6400"/></marker>
    <marker id="a-ink" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#062654"/></marker>
    <marker id="a-sec" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#5b6577"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="329" rx="10" fill="#ffffff" stroke="#062654" stroke-opacity="0.14"/>
  <g font-family="'Noto Sans JP', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#062654" stroke-linecap="round" stroke-linejoin="round">
    <rect x="262" y="40" width="16" height="130" fill="#e8f1f9" stroke="#062654" stroke-width="1.8"/>
    <rect x="250" y="170" width="120" height="86" fill="#e8f1f9" stroke="#062654" stroke-width="1.8"/>
    <path d="M548 26 L548 284" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M278 40 L548 40" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M370 256 L548 256" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M548 40 L548 256" fill="none" stroke="#0097a7" stroke-width="2.4"/>
    <path d="M414 148 L548 148" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="548" cy="148" r="4.5" fill="#ffffff" stroke="#062654" stroke-width="1.2"/>
    <path d="M52 70 L145 70" fill="none" stroke="#5b6577" stroke-width="1.8" marker-end="url(#a-sec)"/>
    <path d="M52 118 L145 118" fill="none" stroke="#5b6577" stroke-width="1.8" marker-end="url(#a-sec)"/>
    <path d="M52 166 L145 166" fill="none" stroke="#5b6577" stroke-width="1.8" marker-end="url(#a-sec)"/>
    <path d="M52 214 L145 214" fill="none" stroke="#5b6577" stroke-width="1.8" marker-end="url(#a-sec)"/>
    <text x="52" y="246" font-size="12" fill="#5b6577">flow or sunlight</text>
    <path d="M150 286 L67 286" fill="none" stroke="#062654" stroke-width="2.4" marker-end="url(#a-ink)"/>
    <text x="160" y="291" font-size="14" fill="#062654"><tspan font-weight="700">u</tspan></text>
    <path d="M318 208 L318 153" fill="none" stroke="#3382c2" stroke-width="2.4" marker-end="url(#a-acc)"/>
    <path d="M318 148 L405 148" fill="none" stroke="#8a6400" stroke-width="2.4" marker-end="url(#a-gold)"/>
    <path d="M346.2 218.3 A30 30 0 0 1 291.9 222.8" fill="none" stroke="#062654" stroke-width="1.8" marker-end="url(#a-ink)"/>
    <circle cx="318" cy="208" r="5" fill="#e7bd41" stroke="#062654" stroke-width="1.2"/>
    <circle cx="318" cy="148" r="4.5" fill="#ffffff" stroke="#062654" stroke-width="1.2"/>
    <text x="306" y="213" font-size="12" fill="#062654" text-anchor="end">CM</text>
    <text x="308" y="152" font-size="12" fill="#062654" text-anchor="end">CP</text>
    <text x="328" y="186" font-size="14" fill="#1f63a0"><tspan font-weight="700">l</tspan></text>
    <text x="380" y="138" font-size="14" fill="#8a6400"><tspan font-weight="700">F</tspan></text>
    <text x="384" y="232" font-size="14" fill="#062654"><tspan font-weight="700">τ</tspan> = <tspan font-weight="700">l</tspan> × <tspan font-weight="700">F</tspan></text>
    <text x="560" y="152" font-size="12" fill="#5b6577">centroid</text>
    <text x="560" y="60" font-size="12" fill="#006d79">silhouette,</text>
    <text x="560" y="75" font-size="12" fill="#006d79">area A</text>
    <text x="548" y="304" font-size="12" fill="#5b6577" text-anchor="middle">plane ⊥ <tspan font-weight="700">u</tspan></text>
  </g>
</svg>
