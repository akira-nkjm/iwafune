  <title id="t">Build-up of wheel momentum: secular trend and cyclic part</title>
  <desc id="d">Accumulated momentum H against time t. The curve oscillates with amplitude Hc about a straight trend that rises by the secular gain every orbit period P. The line trend plus Hc reaches the usable capacity Hcap at the time Tdump, when the wheels must be unloaded.</desc>
