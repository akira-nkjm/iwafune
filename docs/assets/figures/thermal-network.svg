<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Thermal node network</title>
  <desc id="d">An exterior node and an interior node, each with a temperature and a heat capacity, joined by a conductive link G_ij and a radiative link E_ij. Sunlight, albedo and infrared enter the exterior node, which radiates to space. Internal dissipation enters both nodes and a heater feeds the interior node.</desc>
  <defs>
    <marker id="a-acc" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#3382c2"/></marker>
    <marker id="a-gold" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#8a6400"/></marker>
    <marker id="a-ink" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#062654"/></marker>
    <marker id="a-teal" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#0097a7"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="299" rx="10" fill="#ffffff" stroke="#062654" stroke-opacity="0.14"/>
  <g font-family="'Noto Sans JP', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#062654" stroke-linecap="round" stroke-linejoin="round">
    <rect x="112" y="116" width="160" height="72" rx="8" fill="#e8f1f9" stroke="#062654" stroke-width="1.8"/>
    <text x="192" y="146" font-size="14" fill="#062654" text-anchor="middle">exterior node</text>
    <text x="192" y="170" font-size="14" fill="#062654" text-anchor="middle">T<tspan dy="4" font-size="10">i</tspan><tspan dy="-4">, C</tspan><tspan dy="4" font-size="10">i</tspan></text>
    <rect x="448" y="116" width="160" height="72" rx="8" fill="#e8f1f9" stroke="#062654" stroke-width="1.8"/>
    <text x="528" y="146" font-size="14" fill="#062654" text-anchor="middle">interior node</text>
    <text x="528" y="170" font-size="14" fill="#062654" text-anchor="middle">T<tspan dy="4" font-size="10">j</tspan><tspan dy="-4">, C</tspan><tspan dy="4" font-size="10">j</tspan></text>
    <path d="M281 138 L439 138" fill="none" stroke="#062654" stroke-width="1.8" marker-end="url(#a-ink)" marker-start="url(#a-ink)"/>
    <path d="M281 168 L439 168" fill="none" stroke="#3382c2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-acc)" marker-start="url(#a-acc)"/>
    <text x="360" y="127" font-size="14" fill="#062654" text-anchor="middle">conduction G<tspan dy="4" font-size="10">ij</tspan></text>
    <text x="360" y="190" font-size="14" fill="#1f63a0" text-anchor="middle">radiation E<tspan dy="4" font-size="10">ij</tspan></text>
    <path d="M152 58 L152 107" fill="none" stroke="#8a6400" stroke-width="2.4" marker-end="url(#a-gold)"/>
    <text x="152" y="44" font-size="14" fill="#8a6400" text-anchor="middle">sunlight, albedo, infrared</text>
    <path d="M238 112 L238 63" fill="none" stroke="#3382c2" stroke-width="2.4" marker-end="url(#a-acc)"/>
    <text x="250" y="78" font-size="14" fill="#1f63a0">radiation</text>
    <text x="250" y="96" font-size="14" fill="#1f63a0">to space</text>
    <path d="M192 246 L192 197" fill="none" stroke="#0097a7" stroke-width="2.4" marker-end="url(#a-teal)"/>
    <text x="192" y="266" font-size="14" fill="#006d79" text-anchor="middle">internal dissipation</text>
    <path d="M528 246 L528 197" fill="none" stroke="#0097a7" stroke-width="2.4" marker-end="url(#a-teal)"/>
    <text x="528" y="266" font-size="14" fill="#006d79" text-anchor="middle">internal dissipation, heater</text>
  </g>
</svg>
