<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Conical shadow and beta angle</title>
  <desc id="d">Left: the Sun and a body with the tangent rays that bound the shadow. The converging outer tangents bound the umbra, where the Sun is hidden; the diverging inner tangents bound the penumbra, where it is partly hidden. Right: the orbit plane seen edge-on with its normal h, the Sun direction s and the beta angle between s and the plane.</desc>
