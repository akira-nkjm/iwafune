<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 304" role="img" aria-labelledby="t d">
  <title id="t">Mount tree and the mass each mount carries</title>
  <desc id="d">PANEL_PY (0.06 kg) carries SAP_PY (0.18 kg), SP_PY (0.1 kg) and SS_PY (0.035 kg). SAP_PY carries the four cell modules CELL_MOD_1 to CELL_MOD_4 of 0.013 kg each, 0.052 kg. The PANEL_PY mount therefore carries 0.367 kg.</desc>
  <rect x="0.5" y="0.5" width="719" height="303" rx="10" fill="#ffffff" stroke="#062654" stroke-opacity="0.14"/>
  <g font-family="'Noto Sans JP', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#062654" stroke-linecap="round" stroke-linejoin="round">
    <rect x="262" y="24" width="196" height="70" rx="6" fill="#e8f1f9" stroke="#062654" stroke-width="1.8"/>
    <text x="360" y="47" font-size="14" fill="#062654" text-anchor="middle">PANEL_PY</text>
    <text x="360" y="65" font-size="12" fill="#5b6577" text-anchor="middle">0.06 kg</text>
    <text x="360" y="84" font-size="12" fill="#1f63a0" text-anchor="middle" font-weight="700">mount carries 0.367 kg</text>
    <path d="M360 94 L360 116" fill="none" stroke="#062654" stroke-width="1.8"/>
    <path d="M134 116 L586 116" fill="none" stroke="#062654" stroke-width="1.8"/>
    <path d="M134 116 L134 138" fill="none" stroke="#062654" stroke-width="1.8"/>
    <path d="M360 116 L360 138" fill="none" stroke="#062654" stroke-width="1.8"/>
    <path d="M586 116 L586 138" fill="none" stroke="#062654" stroke-width="1.8"/>
    <rect x="36" y="138" width="196" height="70" rx="6" fill="#e8f1f9" stroke="#062654" stroke-width="1.8"/>
    <text x="134" y="161" font-size="14" fill="#062654" text-anchor="middle">SAP_PY</text>
    <text x="134" y="179" font-size="12" fill="#5b6577" text-anchor="middle">0.18 kg</text>
    <text x="134" y="198" font-size="12" fill="#1f63a0" text-anchor="middle" font-weight="700">mount carries 0.052 kg</text>
    <rect x="262" y="138" width="196" height="52" rx="6" fill="#f5f7fa" stroke="#062654" stroke-width="1.8"/>
    <text x="360" y="161" font-size="14" fill="#062654" text-anchor="middle">SP_PY</text>
    <text x="360" y="179" font-size="12" fill="#5b6577" text-anchor="middle">0.1 kg</text>
    <rect x="488" y="138" width="196" height="52" rx="6" fill="#f5f7fa" stroke="#062654" stroke-width="1.8"/>
    <text x="586" y="161" font-size="14" fill="#062654" text-anchor="middle">SS_PY</text>
    <text x="586" y="179" font-size="12" fill="#5b6577" text-anchor="middle">0.035 kg</text>
    <path d="M134 208 L134 230" fill="none" stroke="#062654" stroke-width="1.8"/>
    <rect x="36" y="230" width="196" height="52" rx="6" fill="#f5f7fa" stroke="#062654" stroke-width="1.8"/>
    <text x="134" y="253" font-size="14" fill="#062654" text-anchor="middle">CELL_MOD_1 to _4</text>
    <text x="134" y="271" font-size="12" fill="#5b6577" text-anchor="middle">4 × 0.013 kg</text>
    <text x="260" y="252" font-size="12" fill="#5b6577">A mount carries every mass</text>
    <text x="260" y="268" font-size="12" fill="#5b6577">mounted on it, directly or through other parts.</text>
  </g>
</svg>
