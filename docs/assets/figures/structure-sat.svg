    <path d="M454 138 L454 262" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M100 262 L635 262" fill="none" stroke="#062654" stroke-width="1.8" marker-end="url(#a-ink)"/>
    <text x="638" y="250" font-size="14" fill="#062654" text-anchor="end"><tspan font-weight="700">n̂</tspan></text>
