<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" role="img" aria-labelledby="t d">
  <title id="t">Gap between two boxes on a candidate axis</title>
  <desc id="d">Boxes A and B with centres r_A and r_B are projected onto a candidate axis n. Their projections are intervals of half-length s_A and s_B about the projected centres. The gap g is the distance of the projected centres less s_A and s_B.</desc>
