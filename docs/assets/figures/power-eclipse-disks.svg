<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="t d">
  <title id="t">Apparent disks and illumination fraction</title>
  <desc id="d">Left: seen from the spacecraft, the Sun disk of angular radius a is partly covered by the disk of the occulting body of angular radius b, with the centres separated by the angle c. Right: the illumination fraction nu against c, zero up to b minus a, rising through the penumbra and one from a plus b.</desc>
