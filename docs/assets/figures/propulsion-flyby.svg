<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="t d">
  <title id="t">Fly-by hyperbola with its asymptotes and turn angle</title>
  <desc id="d">A hyperbolic path past a body that sits at the focus, on the concave side of the path. The closest point is at the periapsis radius rp from the body centre. The path follows the incoming asymptote, bends around the body and leaves along the outgoing asymptote. The turn angle delta is the angle between the incoming and outgoing excess velocities.</desc>
