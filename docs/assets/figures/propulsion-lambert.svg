<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="t d">
  <title id="t">Lambert arc between two body positions</title>
  <desc id="d">The Sun at the focus, the circular orbits of the departure and target bodies, and the position vectors r1 at departure and r2 at arrival. A conic arc about the Sun joins the two positions; its velocities v1 and v2 are tangent to the arc at the ends. The transfer angle nu is measured at the Sun from r1 to r2 in the prograde direction.</desc>
