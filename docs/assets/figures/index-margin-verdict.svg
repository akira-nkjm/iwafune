<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 170" role="img" aria-labelledby="t d">
  <title id="t">Three-level verdict from a margin and a warning threshold</title>
  <desc id="d">A number line of the margin m. Below zero, or when m is NaN, the verdict is violation. From zero up to the warning threshold w it is warning. From w upwards it is ok.</desc>
  <defs>
    <marker id="a-ink" viewBox="0 0 7 7" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0 0 L7 3.5 L0 7 Z" fill="#062654"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="719" height="169" rx="10" fill="#ffffff" stroke="#062654" stroke-opacity="0.14"/>
  <g font-family="'Noto Sans JP', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#062654" stroke-linecap="round" stroke-linejoin="round">
    <rect x="40" y="32" width="200" height="64" fill="#b92626" fill-opacity="0.1"/>
    <text x="140" y="60" font-size="14" fill="#b92626" text-anchor="middle" font-weight="700">violation</text>
    <text x="140" y="81" font-size="12" fill="#062654" text-anchor="middle">m &lt; 0, or m is NaN</text>
    <rect x="240" y="32" width="200" height="64" fill="#e7bd41" fill-opacity="0.3"/>
    <text x="340" y="60" font-size="14" fill="#8a6400" text-anchor="middle" font-weight="700">warning</text>
    <text x="340" y="81" font-size="12" fill="#062654" text-anchor="middle">0 ≤ m &lt; w</text>
    <rect x="440" y="32" width="224" height="64" fill="#0097a7" fill-opacity="0.14"/>
    <text x="552" y="60" font-size="14" fill="#006d79" text-anchor="middle" font-weight="700">ok</text>
    <text x="552" y="81" font-size="12" fill="#062654" text-anchor="middle">m ≥ w</text>
    <path d="M40 112 L685 112" fill="none" stroke="#062654" stroke-width="1.8" marker-end="url(#a-ink)"/>
    <path d="M240 32 L240 118" fill="none" stroke="#062654" stroke-width="1.8"/>
    <text x="240" y="136" font-size="14" fill="#062654" text-anchor="middle">0</text>
    <path d="M440 32 L440 118" fill="none" stroke="#062654" stroke-width="1.8"/>
    <text x="440" y="136" font-size="14" fill="#062654" text-anchor="middle">w</text>
    <text x="690" y="136" font-size="14" fill="#062654" text-anchor="end">margin m</text>
  </g>
</svg>
