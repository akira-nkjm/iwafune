    <path d="M398.3 146.6 L410.3 134.6" fill="none" stroke="#062654" stroke-width="2.4"/>
    <text x="232" y="69.5" font-size="14" fill="#062654">silhouette 1</text>
    <text x="485" y="214.9" font-size="14" fill="#062654" text-anchor="middle">silhouette 2</text>
    <path d="M152 274 L164 286" fill="none" stroke="#062654" stroke-width="2.4"/>
