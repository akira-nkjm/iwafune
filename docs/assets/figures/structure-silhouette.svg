    <path d="M150 78 L620 78" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M150 95.5 L620 95.5" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M150 113 L620 113" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M150 125.5 L620 125.5" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M150 188 L620 188" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M150 231.8 L620 231.8" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M150 250.5 L620 250.5" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4"/>
    <path d="M220 156.8 L592.8 156.8" fill="none" stroke="#3382c2" stroke-width="3.2"/>
    <path d="M220 148.8 L220 164.8" fill="none" stroke="#3382c2" stroke-width="2.4"/>
    <path d="M592.8 148.8 L592.8 164.8" fill="none" stroke="#3382c2" stroke-width="2.4"/>
    <text x="210" y="161.8" font-size="14" fill="#1f63a0" text-anchor="end">L</text>
