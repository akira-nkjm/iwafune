  <g font-family="'Noto Sans JP', 'Noto Sans', system-ui, sans-serif" font-size="14" fill="#062654" stroke-linecap="round" stroke-linejoin="round">
    <rect x="150" y="125.5" width="470" height="62.5" fill="#fbf3d9"/>
    <path d="M220 50.5 L445 50.5 L445 188 L220 188 Z" fill="#3382c2" stroke="#062654" stroke-width="1.8" fill-opacity="0.14"/>
    <path d="M382.5 113 L507.5 78 L607.5 125.5 L557.5 231.8 L432.5 250.5 L357.5 188 Z" fill="#3382c2" stroke="#062654" stroke-width="1.8" fill-opacity="0.14"/>
