<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" role="img" aria-labelledby="t d">
  <title id="t">Union of silhouettes cut into slabs</title>
  <desc id="d">Two overlapping convex silhouettes. Horizontal cuts at every vertex height and at every crossing of their edges divide the plane into slabs. In the highlighted slab the union is one interval from L to R. The centroid of the union is marked.</desc>
