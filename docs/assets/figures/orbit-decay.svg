<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-labelledby="t d">
  <title id="t">Altitude against time: passive decay and banded hold</title>
  <desc id="d">Altitude h against time t. Without thrust the altitude falls slowly at first and then faster, and reaches the re-entry altitude at the end of the lifetime. With banded maintenance the altitude follows the same decay until it has fallen by the band b, is raised back to the starting altitude, and repeats.</desc>
