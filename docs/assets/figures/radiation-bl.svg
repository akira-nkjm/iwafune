    <text x="312" y="212" font-size="14" fill="#062654">sample (L, B/B<tspan dy="3.5" font-size="10">0</tspan><tspan dy="-3.5">)</tspan></text>
    <text x="596" y="56" font-size="12" fill="#5b6577" text-anchor="middle">orbit samples</text>
    <text x="266" y="112" font-size="12" fill="#5b6577">equal flux</text>
    <text x="640" y="336" font-size="12" fill="#5b6577" text-anchor="end">each tick: log<tspan dy="3.5" font-size="10">10</tspan><tspan dy="-3.5"> F is 1/4 lower</tspan></text>
  </g>
