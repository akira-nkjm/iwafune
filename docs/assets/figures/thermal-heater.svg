<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="t d">
  <title id="t">Thermostat heater with hysteresis</title>
  <desc id="d">Node temperature against time. With the heater on the temperature rises to the upper set point T_off, where the heater switches off. It then falls to the lower set point T_on, where the heater switches on again. Between the two set points the heater keeps its state. A strip below shows the on and off intervals.</desc>
