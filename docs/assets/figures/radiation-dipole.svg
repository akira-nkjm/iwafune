<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="t d">
  <title id="t">Dipole field line with its mirror points</title>
  <desc id="d">A field line of a centred dipole, r = L a cos^2 of the latitude, crossing the magnetic equator at the distance L a from the centre. The field is weakest, B0, at the equator. A particle that mirrors at the point P, where the field is Bm, moves along the highlighted arc between P and the conjugate point, where B is at most Bm.</desc>
