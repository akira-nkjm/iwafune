    <path d="M104 145 L104 228" fill="none" stroke="#5b6577" stroke-width="1.2" marker-end="url(#a-sec)" marker-start="url(#a-sec)"/>
    <path d="M98 140 L118 140" fill="none" stroke="#5b6577" stroke-width="1.2"/>
