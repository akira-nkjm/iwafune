    <text x="66" y="188" font-size="14" fill="#062654"><tspan font-weight="700">n̂</tspan></text>
    <text x="32" y="292" font-size="12" fill="#5b6577">outer face of a part, side view</text>
    <path d="M120 140 L180 236 L278.5 236 L196 104 L196 140 Z" fill="#062654" fill-opacity="0.07"/>
