    <path d="M270 110 L270 72.1" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#a-sec)"/>
    <path d="M270 110 L248.9 124.9" fill="none" stroke="#5b6577" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#a-sec)"/>
