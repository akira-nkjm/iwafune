<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 306" role="img" aria-labelledby="t d">
  <title id="t">Parallel-axis shift of a part inertia</title>
  <desc id="d">The body origin O with the body axes X, Y and Z, the spacecraft centre of mass C at r_cm and the centre P of a part box at r_i. The offset d_i = r_i - r_cm runs from C to P. Axes parallel to the body axes are drawn at C and at P.</desc>
  <defs>
