initial_soc           = 0.9
conversion_efficiency = 0.9
orbits                = 15

[mode_share]  # Fraction of the orbit-averaged time spent in each mode (sums to 1)
DOWNLINK = 0.1
MISSION  = 0.05
NOMINAL  = 0.85

# Mode sequence over one orbit (about 95.6 min)
[[sequence]]
mode     = "NOMINAL"
duration = { value = 76.0, unit = "min" }

[[sequence]]
mode     = "MISSION"
duration = { value = 5.0, unit = "min" }

[[sequence]]
mode     = "NOMINAL"
duration = { value = 5.0, unit = "min" }

[[sequence]]
mode     = "DOWNLINK"
duration = { value = 9.6, unit = "min" }

[sequences.imaging]
anchor = { from = "eclipse_exit" }

[[sequences.imaging.segments]]
mode     = "NOMINAL"
duration = { value = 40.0, unit = "min" }

[[sequences.imaging.segments]]
mode     = "MISSION"
duration = { value = 10.0, unit = "min" }

[[sequences.imaging.segments]]
mode     = "NOMINAL"
duration = { value = 35.6, unit = "min" }

[[sequences.imaging.segments]]
mode     = "DOWNLINK"
duration = { value = 10.0, unit = "min" }

[sequences.downlink]
anchor = { from = "eclipse_exit", offset = { value = 10.0, unit = "min" } }

[[sequences.downlink.segments]]
mode     = "NOMINAL"
duration = { value = 60.0, unit = "min" }

[[sequences.downlink.segments]]
mode     = "DOWNLINK"
duration = { value = 15.0, unit = "min" }

[[sequences.downlink.segments]]
mode     = "NOMINAL"
duration = { value = 20.6, unit = "min" }
