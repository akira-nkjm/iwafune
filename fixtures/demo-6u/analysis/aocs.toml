drag_coefficient         = 2.2
srp_coefficient          = 1.3
residual_dipole          = { x = 0.01, y = 0.01, z = 0.02, unit = "A*m^2" }
usable_momentum_fraction = 0.8
unload_dipole_fraction   = 0.7
slew_angle               = { value = 90.0, unit = "deg" }

[law.SAFE]
law       = "sun_pointing"
axis      = { x = 1.0, y = 0.0, z = 0.0 }
secondary = { x = 0.0, y = 0.0, z = 1.0 }

[law.NOMINAL]
law       = "sun_pointing"
axis      = { x = 1.0, y = 0.0, z = 0.0 }
secondary = { x = 0.0, y = 0.0, z = 1.0 }

[law.MISSION]
law         = "nadir_pointing"
axis        = { x = 0.0, y = 0.0, z = 1.0 }
along_track = { x = 0.0, y = 1.0, z = 0.0 }

[law.DOWNLINK]
law         = "nadir_pointing"
axis        = { x = 0.0, y = 0.0, z = 1.0 }
along_track = { x = 0.0, y = 1.0, z = 0.0 }
