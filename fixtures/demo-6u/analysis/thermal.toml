contact_conductance = { value = 0.5, unit = "W/K" }  # Default per mounting location
radiative_coupling  = { value = 0.002, unit = "m^2" }  # Default ε·A between internal nodes
initial_temperature = { value = 20.0, unit = "degC" }
time_step           = { value = 30.0, unit = "s" }
orbits              = 5

[case.hot]
label      = "Hot (summer solstice, high β)"
mode       = "MISSION"
solar_flux = { value = 1414.0, unit = "W/m^2" }
albedo     = 0.35
planet_ir  = { value = 258.0, unit = "W/m^2" }
beta       = { value = 60.0, unit = "deg" }
preset     = "hot"

[case.cold]
label      = "Cold (winter solstice, β 0)"
mode       = "SAFE"
solar_flux = { value = 1322.0, unit = "W/m^2" }
albedo     = 0.25
planet_ir  = { value = 216.0, unit = "W/m^2" }
beta       = { value = 0.0, unit = "deg" }
preset     = "safe_mode"

[case.cold_nominal]
label  = "Cold (nominal operation, β 0)"
preset = "cold"
mode   = "NOMINAL"
beta   = { value = 0.0, unit = "deg" }

[nodes]  # Node -> parts lumped into it
BAT      = ["BAT", "HTR_BAT"]
BUS      = ["BUS_FRAME"]
CAM      = ["CAM", "HTR_CAM"]
ELEC     = ["OBC", "PCDU", "GPS", "UHF_TRX", "STX"]
MTQ      = ["MTQ_X", "MTQ_Y", "MTQ_Z"]
PANEL_MX = ["PANEL_MX", "SP_MX", "SS_MX"]
PANEL_MY = ["PANEL_MY", "SP_MY", "SS_MY", "STT"]
PANEL_MZ = ["PANEL_MZ", "RW_X", "RW_Y", "RW_Z"]
PANEL_PX = ["PANEL_PX", "SP_PX", "SS_PX"]
PANEL_PY = ["PANEL_PY", "SP_PY", "SS_PY"]
PANEL_PZ = ["PANEL_PZ"]
SAP      = ["SAP_PY", "CELL_MOD_1", "CELL_MOD_2", "CELL_MOD_3", "CELL_MOD_4"]

[margin]
uncertainty = { value = 5.0, unit = "K" }

[coating.white_paint]
label        = "White paint"
absorptivity = 0.2
emissivity   = 0.85

[coating.black_paint]
label        = "Black paint"
absorptivity = 0.92
emissivity   = 0.86

[surface.PANEL_PX]
white_paint = 0.86
black_paint = 0.14

[enclosure]
emissivity = 0.85

[conductive.BAT]
PANEL_MZ = { value = 0.8, unit = "W/K" }
