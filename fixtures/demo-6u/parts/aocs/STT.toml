# Boresight is -Y (rotated by the attitude of mount point STT_SLOT). Orthogonal to both sun pointing (+X) and nadir pointing (+Z)
catalog = "local/stt_nano"

[mount]
on    = "PANEL_MY"
point = "STT_SLOT"

[pose]
position    = { x = 0.0, y = -140.0, z = -43.0, unit = "mm" }
orientation = { w = 1.0, x = 0.0, y = 0.0, z = 0.0 }

[ports.PWR]
net = "P5V"

[ports.DATA]
net = "CAN_BUS"
