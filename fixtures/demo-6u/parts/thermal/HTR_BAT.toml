kind     = "heater"
label    = "Battery heater"
maturity = "off_the_shelf"

[mount]
on = "BAT"

[attr]
specific_heat = { value = 1100.0, unit = "J/(kg*K)" }
setpoint      = { min = 20.0, max = 25.0, unit = "degC" }

[attr.mass]
value       = 5.0
unit        = "g"
from.source = "tbd"

[attr.power]
off            = { value = 0.0, unit = "W" }
on.value       = 3.0
on.unit        = "W"
on.from.source = "sys_judgement"

[ports.PWR]
net = "BAT_BUS"
