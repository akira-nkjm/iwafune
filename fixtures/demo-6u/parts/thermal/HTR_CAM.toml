kind     = "heater"
label    = "Camera optics heater"
maturity = "off_the_shelf"

[mount]
on = "CAM"

[attr]
specific_heat = { value = 1100.0, unit = "J/(kg*K)" }
setpoint      = { min = 0.0, max = 5.0, unit = "degC" }

[attr.mass]
value       = 4.0
unit        = "g"
from.source = "tbd"

[attr.power]
off            = { value = 0.0, unit = "W" }
on.value       = 1.0
on.unit        = "W"
on.from.source = "sys_judgement"

[ports.PWR]
net = "P5V"
