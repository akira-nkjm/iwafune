kind     = "heater"
label    = "カメラ光学系ヒータ"
maturity = "off_the_shelf"

[mount]
on = "CAM"

[attr]
mass          = { value = 4.0, unit = "g", from = { source = "tbd" } }
specific_heat = { value = 1100.0, unit = "J/(kg*K)" }
setpoint      = { min = 0.0, max = 5.0, unit = "degC" }

[attr.power]
off = { value = 0.0, unit = "W" }
on  = { value = 1.0, unit = "W", from = { source = "sys_judgement" } }

[ports.PWR]
net = "P5V"
