MTQ_Y   = { state = "off", duty = { on = 0.5 } }
MTQ_Z   = { state = "off", duty = { on = 0.5 } }
OBC     = { state = "on" }
PCDU    = { state = "on" }
RW_X    = { state = "off" }
RW_Y    = { state = "off" }
RW_Z    = { state = "off" }
SS_MX   = { state = "on" }
SS_MY   = { state = "on" }
SS_PX   = { state = "on" }
SS_PY   = { state = "on" }
STT     = { state = "off" }
