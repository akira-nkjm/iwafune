kind         = "sun_sensor"
label        = "Fine sun sensor (FoV ±60°)"
manufacturer = "Example Optics"
part_number  = "FSS-60"
maturity     = "off_the_shelf"
source       = "ds_vendor"

[attr]
mass           = { value = 35.0, unit = "g" }
specific_heat  = { value = 900.0, unit = "J/(kg*K)" }
boresight      = { x = 0.0, y = 0.0, z = 1.0 }
fov_half_angle = { value = 60.0, unit = "deg" }
temp_op        = { min = -40.0, max = 85.0, unit = "degC" }
size           = { x = 30.0, y = 30.0, z = 10.0, unit = "mm" }

[attr.power]
off = { value = 0.0, unit = "W" }
on  = { value = 130.0, unit = "mW" }
